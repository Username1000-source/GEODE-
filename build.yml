name: Build Mod

on:
  workflow_dispatch:
    inputs:
      sdk:
        description: 'Version de Geode (ej: v5.11.1) o "latest"'
        default: 'v5.11.1'
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64
          - name: iOS
            os: macos-latest
            target: iOS
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4

      # Fija la version de Geode y la copia a mod.json automaticamente.
      # Asi el .geode siempre coincide con tu Geode instalado.
      - name: Fijar version de Geode
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ inputs.sdk || 'v5.11.1' }}"
          if [ "$V" = "latest" ]; then
            V=$(gh api repos/geode-sdk/geode/releases/latest --jq .tag_name)
          fi
          echo "SDK_VERSION=$V" >> "$GITHUB_ENV"
          sed -i.bak -E "s/\"geode\": *\"[^\"]*\"/\"geode\": \"${V#v}\"/" mod.json
          rm -f mod.json.bak
          grep '"geode"' mod.json

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: ${{ env.SDK_VERSION }}
          bindings: geode-sdk/bindings
          bindings-ref: main
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
